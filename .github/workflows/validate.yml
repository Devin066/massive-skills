name: Validate Skills

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Run skill validation
        run: bash scripts/validate-skills.sh

      - name: Set up Python for Agent Skills validation
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate the official Agent Skills specification
        run: |
          python -m pip install "skills-ref @ git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref"
          skills-ref validate skills/massive

      - name: Install into every documented coding agent
        run: bash scripts/test-agent-installs.sh

      - name: Validate Claude marketplace and plugin manifests
        run: |
          npm install -g @anthropic-ai/claude-code
          # Not --strict at the root: the contributor-only CLAUDE.md always triggers the
          # expected "not loaded as plugin context" warning (Agora documents the same).
          # Errors still fail the step.
          claude plugin validate .
          claude plugin validate ./.claude-plugin/plugin.json

      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@v18
        with:
          globs: "skills/**/*.md tests/**/*.md *.md massive/*.md"

  starter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/massive/assets/starter-nextjs
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npx next build
